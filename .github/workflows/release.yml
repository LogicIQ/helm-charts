name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.16.3

      - name: Create gh-pages branch if not exists
        run: |
          git checkout --orphan gh-pages || git checkout gh-pages
          git reset --hard
          git commit --allow-empty -m "Initial gh-pages commit"
          git push origin gh-pages || true
          git checkout main

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          skip_existing: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Add Google Analytics to gh-pages
        run: |
          git checkout gh-pages
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>LogicIQ Helm Charts</title>
            <meta http-equiv="refresh" content="0; url=https://github.com/LogicIQ/helm-charts">
            <script async src="https://www.googletagmanager.com/gtag/js?id=G-LEHEWN0WHN"></script>
            <script>
              window.dataLayer = window.dataLayer || [];
              function gtag(){dataLayer.push(arguments);}
              gtag('js', new Date());
              gtag('config', 'G-LEHEWN0WHN');
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="https://github.com/LogicIQ/helm-charts">LogicIQ Helm Charts</a>...</p>
          </body>
          </html>
          EOF
          git add index.html
          git commit -m "Add Google Analytics" || true
          git push origin gh-pages