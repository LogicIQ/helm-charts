name: CI Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-konductor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.16.3

      - name: Create kind cluster
        uses: helm/kind-action@v1.13.0

      - name: Deploy and verify
        run: |
          kubectl create namespace konductor
          helm install konductor charts/konductor --namespace konductor --wait --timeout=5m
          kubectl wait --for=condition=Ready pods -l app.kubernetes.io/name=konductor -n konductor --timeout=120s
          kubectl get pods -n konductor

